version: '3.8'

services:
  portfolio_db:
    image: pgvector/pgvector:pg17
    container_name: portfolio_pgvector
    environment:
      POSTGRES_DB: portfolio_vault
      POSTGRES_USER: ai_admin
      # NOTE: Hardcoded dummy credentials for 1-click reviewer testing only.
      # Never commit real secrets to version control.
      POSTGRES_PASSWORD: dummy_password_for_local_test
    ports:
      - "5432:5432"
    volumes:
      - portfolio_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_admin -d portfolio_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  portfolio_api:
    build: .
    container_name: portfolio_api
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://ai_admin:dummy_password_for_local_test@portfolio_db:5432/portfolio_vault
      # Leave OPENAI_API_KEY as 'dummy' to test logic locally without API charges
      - OPENAI_API_KEY=dummy
    depends_on:
      portfolio_db:
        condition: service_healthy

volumes:
  portfolio_db_data:
