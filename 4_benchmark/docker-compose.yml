version: '3.8'

services:
  portfolio_pg_benchmark:
    image: pgvector/pgvector:pg18
    container_name: portfolio_pg_benchmark
    environment:
      POSTGRES_DB: benchmark_db
      POSTGRES_USER: benchmark_user
      POSTGRES_PASSWORD: dummy_password_for_local_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark_user -d benchmark_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  portfolio_surreal_benchmark:
    image: surrealdb/surrealdb:v3.0.5
    container_name: portfolio_surreal_benchmark
    ports:
      - "8000:8000"
    command: start --user root --pass dummy_password_for_local_test memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - surrealdb

  portfolio_qdrant_benchmark:
    image: qdrant/qdrant:v1.17.1
    container_name: portfolio_qdrant_benchmark
    ports:
      - "6333:6333"
    profiles:
      - qdrant
